name: Automatyczny Monitor Giełdowy

on:
  schedule:
    # Uruchamiaj co godzinę od poniedziałku do piątku w czasie trwania giełdy od 9 do 17 (składnia CRON)
    # 7-15 UTC odpowiada 09:00 - 17:00 czasu polskiego w okresie letnim
    - cron: '0 7-15 * * 1-5'
  workflow_dispatch: # Umożliwia ręczne uruchomienie z zakładki Actions na GitHubie

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Pobranie kodu repozytorium
      uses: actions/checkout@v5

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Instalacja zależności
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Uruchomienie skryptu monitorującego
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python monitor.py