name: Automatyczny Monitor Giełdowy

on:
  schedule:
    # Uruchamiaj co godzinę od poniedziałku do piątku (składnia CRON)
    - cron: '0 * * * 1-5'
  workflow_dispatch: # Umożliwia ręczne uruchomienie z zakładki Actions na GitHubie

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Pobranie kodu repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja zależności
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Uruchomienie skryptu monitorującego
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python monitor.py